<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="54" font-size="27" font-weight="700" fill="#0b0b0b">How a value is bound to its context</text>
  <text x="40" y="82" font-size="16" fill="#52514e">CPDPM key hierarchy and encryption path. Nothing in the ciphertext identifies the key or the context; both are re-derived by the caller.</text>

  <!-- lane headers -->
  <text x="40" y="124" font-size="13" font-weight="700" fill="#52514e" letter-spacing="1.5">1 · KEYS</text>
  <text x="430" y="124" font-size="13" font-weight="700" fill="#52514e" letter-spacing="1.5">2 · BINDING</text>
  <text x="820" y="124" font-size="13" font-weight="700" fill="#52514e" letter-spacing="1.5">3 · ENCRYPTION</text>
  <line x1="40" y1="134" x2="380" y2="134" stroke="#d9d9d5" stroke-width="1"/>
  <line x1="430" y1="134" x2="770" y2="134" stroke="#d9d9d5" stroke-width="1"/>
  <line x1="820" y1="134" x2="1160" y2="134" stroke="#d9d9d5" stroke-width="1"/>

  <!-- ===== column 1: keys ===== -->
  <rect x="40" y="150" width="340" height="80" rx="6" fill="#f1f1ef" stroke="#8a8a86" stroke-width="1.5"/>
  <text x="60" y="184" font-size="17" font-weight="700" fill="#0b0b0b">Key-encryption key (KEK)</text>
  <text x="60" y="209" font-size="13.5" fill="#52514e">In a KMS or HSM; local AES-GCM wrapper for dev.</text>

  <line x1="210" y1="230" x2="210" y2="282" stroke="#52514e" stroke-width="2"/>
  <polygon points="204,280 216,280 210,290" fill="#52514e"/>
  <text x="222" y="262" font-size="13.5" fill="#52514e">wraps each version</text>

  <rect x="40" y="290" width="340" height="150" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="60" y="322" font-size="17" font-weight="700" fill="#0b0b0b">Master data keys MK[v]</text>
  <rect x="60" y="342" width="96" height="36" rx="5" fill="#ffffff" stroke="#8a8a86" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="108" y="365" font-size="13.5" fill="#52514e" text-anchor="middle">ver 1 · retired</text>
  <rect x="166" y="342" width="96" height="36" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="214" y="365" font-size="13.5" fill="#0b0b0b" text-anchor="middle">ver 2</text>
  <rect x="272" y="342" width="96" height="36" rx="5" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="320" y="365" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">ver 3 · current</text>
  <text x="60" y="408" font-size="13.5" fill="#52514e">32 random bytes each. Rotate adds a version;</text>
  <text x="60" y="426" font-size="13.5" fill="#52514e">retire destroys one and every blob under it.</text>

  <!-- MK[v] -> HKDF -->
  <polyline points="380,440 405,440 405,440 405,440" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <polyline points="380,440 405,440 405,440 430,440" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <polygon points="422,434 422,446 432,440" fill="#2a78d6"/>
  <text x="384" y="430" font-size="12.5" fill="#2a78d6" font-weight="700">MK[v]</text>

  <!-- ===== column 2: binding ===== -->
  <rect x="430" y="150" width="340" height="150" rx="6" fill="#fcf1d9" stroke="#eda100" stroke-width="1.5"/>
  <text x="450" y="180" font-size="17" font-weight="700" fill="#0b0b0b">Context <tspan font-size="13.5" font-weight="400" fill="#52514e">supplied by the caller, every time</tspan></text>
  <text x="450" y="206" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">tenant         org:st-marys</text>
  <text x="450" y="226" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">patient        Patient/8f3a</text>
  <text x="450" y="246" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">resource_type  Condition</text>
  <text x="450" y="266" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">field_path     code.text</text>
  <text x="450" y="286" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#52514e">purpose        (optional)</text>

  <line x1="600" y1="300" x2="600" y2="322" stroke="#52514e" stroke-width="2"/>
  <polygon points="594,320 606,320 600,330" fill="#52514e"/>

  <rect x="430" y="330" width="340" height="50" rx="6" fill="#ffffff" stroke="#eda100" stroke-width="1.5"/>
  <text x="450" y="351" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">0x01 || len||tenant || len||patient || ...</text>
  <text x="450" y="370" font-size="12.5" fill="#52514e">canon(ctx): length-prefixed, NFC-normalised, injective</text>

  <line x1="600" y1="380" x2="600" y2="402" stroke="#52514e" stroke-width="2"/>
  <polygon points="594,400 606,400 600,410" fill="#52514e"/>

  <rect x="430" y="410" width="340" height="60" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="450" y="436" font-size="17" font-weight="700" fill="#0b0b0b">HKDF-SHA256</text>
  <text x="450" y="458" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#52514e">info = "cpdpm/key" || suite || canon(ctx)</text>

  <line x1="580" y1="470" x2="580" y2="502" stroke="#52514e" stroke-width="2"/>
  <polygon points="574,500 586,500 580,510" fill="#52514e"/>
  <rect x="430" y="510" width="300" height="40" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="450" y="536" font-size="15" font-weight="700" fill="#0b0b0b">K_ctx <tspan font-weight="400" font-size="13.5" fill="#52514e">per-context AEAD key, 32 bytes</tspan></text>

  <polyline points="750,470 750,590 738,590" fill="none" stroke="#52514e" stroke-width="2"/>
  <polygon points="740,584 740,596 730,590" fill="#52514e"/>
  <rect x="430" y="570" width="300" height="40" rx="6" fill="#ffffff" stroke="#eda100" stroke-width="1.5"/>
  <text x="450" y="596" font-size="15" font-weight="700" fill="#0b0b0b">commit <tspan font-weight="400" font-size="13.5" fill="#52514e">key commitment, 32 bytes</tspan></text>
  <text x="430" y="632" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#52514e">info = "cpdpm/commit" || canon(ctx)</text>

  <!-- ===== column 3: encryption ===== -->
  <rect x="820" y="150" width="340" height="64" rx="6" fill="#f1f1ef" stroke="#8a8a86" stroke-width="1.5"/>
  <text x="840" y="176" font-size="15" font-weight="700" fill="#0b0b0b">Header <tspan font-weight="400" font-size="13.5" fill="#52514e">travels in the clear</tspan></text>
  <text x="840" y="200" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">CPDM · ver · suite · key_version · nonce</text>

  <line x1="990" y1="214" x2="990" y2="232" stroke="#52514e" stroke-width="2"/>
  <polygon points="984,230 996,230 990,240" fill="#52514e"/>

  <rect x="820" y="240" width="340" height="44" rx="6" fill="#fcf1d9" stroke="#eda100" stroke-width="1.5"/>
  <text x="840" y="268" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">AAD = header || canon(ctx)</text>
  <!-- canon -> AAD -->
  <polyline points="770,355 795,355 795,262 812,262" fill="none" stroke="#eda100" stroke-width="2"/>
  <polygon points="810,256 810,268 820,262" fill="#eda100"/>

  <rect x="820" y="310" width="340" height="44" rx="6" fill="#ffffff" stroke="#8a8a86" stroke-width="1.5"/>
  <text x="840" y="338" font-size="13.5" fill="#0b0b0b">nonce from CSPRNG: 96 bit (GCM), 192 bit (XChaCha)</text>
  <line x1="990" y1="354" x2="990" y2="402" stroke="#52514e" stroke-width="2"/>
  <polygon points="984,400 996,400 990,410" fill="#52514e"/>

  <!-- AAD -> AEAD around the right -->
  <polyline points="1160,262 1182,262 1182,538 1170,538" fill="none" stroke="#eda100" stroke-width="2"/>
  <polygon points="1172,532 1172,544 1160,538" fill="#eda100"/>

  <rect x="820" y="410" width="340" height="170" rx="6" fill="#e2f5ee" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="840" y="440" font-size="17" font-weight="700" fill="#0b0b0b">AEAD encrypt</text>
  <text x="840" y="464" font-size="13.5" fill="#52514e">AES-256-GCM  or  XChaCha20-Poly1305</text>
  <text x="840" y="494" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">key        K_ctx</text>
  <text x="840" y="516" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">nonce      from header</text>
  <text x="840" y="538" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">aad        header || canon(ctx)</text>
  <text x="840" y="562" font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">plaintext  commit || message</text>

  <!-- K_ctx -> AEAD key -->
  <polyline points="730,530 790,530 790,494 812,494" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <polygon points="810,488 810,500 820,494" fill="#2a78d6"/>
  <!-- commit -> AEAD plaintext -->
  <polyline points="730,590 805,590 805,562 812,562" fill="none" stroke="#eda100" stroke-width="2"/>
  <polygon points="810,556 810,568 820,562" fill="#eda100"/>

  <line x1="990" y1="580" x2="990" y2="622" stroke="#52514e" stroke-width="2"/>
  <polygon points="984,620 996,620 990,630" fill="#52514e"/>

  <rect x="820" y="630" width="340" height="70" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="840" y="658" font-size="13" font-family="Menlo, Consolas, monospace" fill="#0b0b0b">header || ciphertext || 16-byte tag</text>
  <text x="840" y="682" font-size="13.5" fill="#52514e">No key material and no context inside the blob.</text>

  <!-- footnote -->
  <line x1="40" y1="726" x2="1160" y2="726" stroke="#d9d9d5" stroke-width="1"/>
  <text x="40" y="752" font-size="14" fill="#0b0b0b">Change any context field and both K_ctx and the AAD change: the tag check fails. Retire MK[v] and every blob under version v becomes unrecoverable.</text>
</svg>
