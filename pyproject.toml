[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cpdpm"
version = "0.1.0a0"
description = "Context-bound authenticated encryption for clinical records"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Atunrase Ayo" }]
keywords = ["encryption", "aead", "healthcare", "fhir", "phi", "hipaa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43.0",
]

[project.optional-dependencies]
xchacha = ["pynacl>=1.5"]
password = ["argon2-cffi>=23.1"]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pynacl>=1.5",
  "argon2-cffi>=23.1",
]
paper = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyperf>=2.7",
]

[project.urls]
Homepage = "https://github.com/Ayo-Cyber/cpdpm-secure"
Issues = "https://github.com/Ayo-Cyber/cpdpm-secure/issues"

[tool.hatch.build.targets.wheel]
packages = ["cpdpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
per-file-ignores = { "tests/*" = ["S101"], "paper/*" = ["S101", "S603", "S607", "S311"] }

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cpdpm"]
exclude = ["legacy"]

[[tool.mypy.overrides]]
module = ["nacl.*"]
ignore_missing_imports = true
